# --- Server ---
# NOTE: bank-account-service runs on 8082 — this must be a different port.
server.port=8083

# --- Account Service integration (WebClient base URL) ---
# The Transaction Service NEVER accesses the Account table directly —
# all account reads/writes go through this URL via AccountClient.
account.service.url=http://localhost:8082
fraud.api.url=http://26.93.90.128:59915/api/Fraud/check
# --- MySQL ---
spring.datasource.url=jdbc:mysql://26.167.59.120:3306/bankmanagementdb
spring.datasource.username=banking_user
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
