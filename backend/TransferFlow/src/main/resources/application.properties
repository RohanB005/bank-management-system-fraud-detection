# --- Server ---
# NOTE: bank-account-service runs on 8082 — this must be a different port.
server.port=8083

# --- Account Service integration (WebClient base URL) ---
# The Transaction Service NEVER accesses the Account table directly —
# all account reads/writes go through this URL via AccountClient.
account.service.url=http://localhost:8082

# --- MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/bankmanagementdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=@#MySql2003#@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
