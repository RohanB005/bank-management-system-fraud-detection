# --- Server ---
server.port=${PORT:8083}

# --- Account Service & Fraud Service integration ---
account.service.url=${ACCOUNT_SERVICE_URL:http://bank-account-service:8082}
fraud.api.url=${FRAUD_API_URL:http://fraud-detection-service:5000/api/Fraud/check}

# --- MySQL ---
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:bankmanagementdb}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

