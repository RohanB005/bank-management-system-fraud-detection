server.port=${PORT:8084}

spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:bankmanagementdb}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true

account.service.base-url=${ACCOUNT_SERVICE_URL:http://bank-account-service:8082}
transaction.service.base-url=${TRANSACTION_SERVICE_URL:http://transfer-flow-service:8083}

spring.application.name=bank-ivr-service



