# ================= SERVER =================
server.port=8082

# ================= DATABASE (shared with the rest of the team) =================
spring.datasource.url=jdbc:mysql://localhost:3306/bankmanagementdb
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# IMPORTANT: everyone on the team must use "validate", never "update" or "create" —
# Database.sql is the single source of truth for the schema.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ================= AUTH SERVICE (for customer validation) =================
# Update the port below to match wherever A1's bank-auth-service actually runs
auth.service.base-url=http://localhost:9090

# ================= LOGGING (optional, helpful while developing) =================
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.bank.account=DEBUG

# ================= APP NAME =================
spring.application.name=bank-account-service

jwt.secret=ThisIsMyVerySecretKeyForBankManagementSystem2026


