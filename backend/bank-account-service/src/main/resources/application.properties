# ================= SERVER =================
server.port=${PORT:8082}

# ================= DATABASE (shared with the rest of the team) =================
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:bankmanagementdb}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ================= AUTH SERVICE (for customer validation) =================
auth.service.base-url=${AUTH_SERVICE_URL:http://bank-auth-service:9090}

# ================= LOGGING (optional, helpful while developing) =================
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.bank.account=DEBUG

# ================= APP NAME =================
spring.application.name=bank-account-service

jwt.secret=${JWT_SECRET:ThisIsMyVerySecretKeyForBankManagementSystem2026}



