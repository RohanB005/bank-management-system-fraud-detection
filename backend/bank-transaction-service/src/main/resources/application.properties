spring.application.name=bank-transaction-service

server.port=8081

# ==========================
# Database Configuration
# ==========================
spring.datasource.url=jdbc:mysql://26.167.59.120:3306/bankmanagementdb
spring.datasource.username=banking_user
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
# JPA Configuration
# ==========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================
# Logging
# ==========================
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ==========================
# Account Service Base URL
# ==========================
account.service.url=http://Localhost:8082

jwt.secret=ThisIsMyVerySecretKeyForBankManagementSystem2026