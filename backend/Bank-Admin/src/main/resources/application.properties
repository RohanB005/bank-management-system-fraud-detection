server.port=${PORT:9098}
# --- MySQL ---
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:bankmanagementdb}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#JWT Properties
jwt.secret=${JWT_SECRET:ThisIsMyVerySecretKeyForBankManagementSystem2026}
jwt.expiration=86400000

# Inter-service integration URLs
fraud.service.url=${FRAUD_SERVICE_URL:http://fraud-detection-service:5000}
services.auth.base-url=${AUTH_SERVICE_URL:http://bank-auth-service:9090}
services.account.base-url=${ACCOUNT_SERVICE_URL:http://bank-account-service:8082}
services.transaction.base-url=${TRANSACTION_SERVICE_URL:http://bank-transaction-service:8086}
services.fraud.base-url=${FRAUD_SERVICE_URL:http://fraud-detection-service:5000}
services.ivr.base-url=${IVR_SERVICE_URL:http://bank-ivr-service:8084}