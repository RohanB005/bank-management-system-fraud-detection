version: '3.8'

services:
  # ----------------------------------------------------
  # 1. MySQL 8 Database Service
  # ----------------------------------------------------
  mysql:
    container_name: mysql
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bankmanagementdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/bankmanagementdb.sql:/docker-entrypoint-initdb.d/bankmanagementdb.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - bank-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------
  # 2. Bank Auth Service (Java 21 Spring Boot)
  # ----------------------------------------------------
  bank-auth-service:
    container_name: bank-auth-service
    build:
      context: ./backend/bank-auth-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: bankmanagementdb
      DB_USER: root
      DB_PASS: root
      PORT: 9090
      JWT_SECRET: ThisIsMyVerySecretKeyForBankManagementSystem2026
    ports:
      - "9090:9090"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bank-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------
  # 3. Bank Account Service (Java 21 Spring Boot)
  # ----------------------------------------------------
  bank-account-service:
    container_name: bank-account-service
    build:
      context: ./backend/bank-account-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: bankmanagementdb
      DB_USER: root
      DB_PASS: root
      PORT: 8082
      AUTH_SERVICE_URL: http://bank-auth-service:9090
      JWT_SECRET: ThisIsMyVerySecretKeyForBankManagementSystem2026
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      bank-auth-service:
        condition: service_started
    networks:
      - bank-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------
  # 4. Bank Transaction Service (Java 21 Spring Boot)
  # ----------------------------------------------------
  bank-transaction-service:
    container_name: bank-transaction-service
    build:
      context: ./backend/bank-transaction-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: bankmanagementdb
      DB_USER: root
      DB_PASS: root
      PORT: 8086
      ACCOUNT_SERVICE_URL: http://bank-account-service:8082
      JWT_SECRET: ThisIsMyVerySecretKeyForBankManagementSystem2026
    ports:
      - "8086:8086"
    depends_on:
      mysql:
        condition: service_healthy
      bank-account-service:
        condition: service_started
    networks:
      - bank-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------
  # 5. Fraud Detection Service (.NET 8 ASP.NET Core)
  # ----------------------------------------------------
  fraud-detection-service:
    container_name: fraud-detection-service
    build:
      context: ./backend/fraud-detection-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__FraudDb: "server=mysql;port=3306;database=bankmanagementdb;user=root;password=root;TreatTinyAsBoolean=true;"
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:5000"
      Gemini__ApiKey: "${GEMINI_API_KEY:-YOUR_GEMINI_API_KEY_HERE}"
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bank-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------
  # 6. TransferFlow Service (Java 21 Spring Boot)
  # ----------------------------------------------------
  transfer-flow-service:
    container_name: transfer-flow-service
    build:
      context: ./backend/TransferFlow
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: bankmanagementdb
      DB_USER: root
      DB_PASS: root
      PORT: 8083
      ACCOUNT_SERVICE_URL: http://bank-account-service:8082
      FRAUD_API_URL: http://fraud-detection-service:5000/api/Fraud/check
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      bank-account-service:
        condition: service_started
      fraud-detection-service:
        condition: service_started
    networks:
      - bank-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------
  # 7. Bank IVR Service (Java 21 Spring Boot)
  # ----------------------------------------------------
  bank-ivr-service:
    container_name: bank-ivr-service
    build:
      context: ./backend/bank-ivr-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: bankmanagementdb
      DB_USER: root
      DB_PASS: root
      PORT: 8084
      ACCOUNT_SERVICE_URL: http://bank-account-service:8082
      TRANSACTION_SERVICE_URL: http://transfer-flow-service:8083
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy
      bank-account-service:
        condition: service_started
    networks:
      - bank-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------
  # 8. Bank Admin Service (Java 21 Spring Boot)
  # ----------------------------------------------------
  bank-admin-service:
    container_name: bank-admin-service
    build:
      context: ./backend/Bank-Admin
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: bankmanagementdb
      DB_USER: root
      DB_PASS: root
      PORT: 9098
      JWT_SECRET: ThisIsMyVerySecretKeyForBankManagementSystem2026
      FRAUD_SERVICE_URL: http://fraud-detection-service:5000
      AUTH_SERVICE_URL: http://bank-auth-service:9090
      ACCOUNT_SERVICE_URL: http://bank-account-service:8082
      TRANSACTION_SERVICE_URL: http://bank-transaction-service:8086
      IVR_SERVICE_URL: http://bank-ivr-service:8084
    ports:
      - "9098:9098"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bank-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------
  # 9. React Frontend Service (React 19 + Nginx)
  # ----------------------------------------------------
  frontend:
    container_name: bank-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - bank-auth-service
      - bank-account-service
      - bank-transaction-service
      - transfer-flow-service
      - fraud-detection-service
      - bank-admin-service
    networks:
      - bank-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ----------------------------------------------------
# Networks & Persistent Volumes
# ----------------------------------------------------
networks:
  bank-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
